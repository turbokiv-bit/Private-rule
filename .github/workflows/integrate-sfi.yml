name: Build SFI with reF1nd core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout this repo (contains SFI deb)
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid gomobile 2>/dev/null || brew install dpkg ldid
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Clone reF1nd sing-box branch
        run: |
          git clone --depth 1 -b reF1nd-testing-next https://github.com/reF1nd/sing-box.git core

      - name: Build Libbox framework (gomobile, iOS arm64)
        working-directory: core
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          gomobile bind -v -trimpath -ldflags "-s -w" \
            -target ios -iosversion 15.0 \
            -o "$GITHUB_WORKSPACE/Libbox.xcframework" \
            -tags with_gvisor \
            ./experimental/libbox

      - name: Reassemble SFI deb
        run: cat SFI-1.14.0-iphoneos-arm64.deb.part-* > SFI-1.14.0-iphoneos-arm64.deb && ls -lh SFI-1.14.0-iphoneos-arm64.deb

      - name: Extract SFI deb
        run: |
          ls *.deb
          mkdir -p sfi && cd sfi
          ar x ../SFI-1.14.0-iphoneos-arm64.deb
          mkdir data && tar -xf data.tar.* -C data

      - name: Replace core framework
        run: |
          APP="sfi/data/var/jb/Applications/sing-box.app"
          FW_SRC=$(find Libbox.xcframework -name Library -path '*ios-arm64*' | head -1)
          echo "Framework binary: $FW_SRC"
          cp "$FW_SRC" "$APP/Frameworks/Library.framework/Library"
          # 同步替换各扩展内可能内嵌的副本
          find "$APP" -path '*Library.framework/Library' | while read f; do
            cp "$FW_SRC" "$f"
          done

      - name: Re-sign with ldid
        run: |
          APP="sfi/data/var/jb/Applications/sing-box.app"
          ldid -S "$APP/Frameworks/Library.framework/Library"
          find "$APP" -type f \( -name '*.dylib' \) -exec ldid -S {} \;
          find "$APP/PlugIns" -name '*.appex' -maxdepth 1 | while read e; do
            ldid -S "$e/$(plutil -extract CFBundleExecutable raw "$e/Info.plist")"
          done
          ldid -S "$APP/sing-box"

      - name: Bump package version & repack deb
        run: |
          mkdir ctl && tar -xf sfi/control.tar.* -C ctl
          sed -i '' 's/^Version:.*/Version: 1.14.0+ref1nd/' ctl/control
          (cd ctl && tar -cJf ../sfi/control.tar.xz .)
          (cd sfi/data && tar -cJf ../data.tar.xz .)
          cd sfi && rm -f ../SFI-1.14.0-ref1nd-iphoneos-arm64.deb
          ar rc ../SFI-1.14.0-ref1nd-iphoneos-arm64.deb debian-binary control.tar.xz data.tar.xz
          cd .. && ls -lh SFI-1.14.0-ref1nd-iphoneos-arm64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ref1nd-deb
          path: SFI-1.14.0-ref1nd-iphoneos-arm64.deb
