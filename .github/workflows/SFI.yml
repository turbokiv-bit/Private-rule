name: Build SFI (reF1nd core + Smart outbound)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash

      - name: Clone sing-box-for-apple (with submodules)
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone reF1nd sing-box core
        run: git clone --depth 1 -b reF1nd-stable https://github.com/reF1nd/sing-box.git core

      - name: Extract & Patch Smart outbound from MiChongs
        working-directory: core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add michongs https://github.com/MiChongs/sing-box.git
          git fetch --depth 1 michongs xiaobaf14g-testing

          # 1. 仅提取 smart 出站相关的源码实现
          git checkout michongs/xiaobaf14g-testing -- protocol/group/smart.go option/smart.go 2>/dev/null || true
          git checkout michongs/xiaobaf14g-testing -- protocol/group/smart/ 2>/dev/null || true
          git checkout michongs/xiaobaf14g-testing -- option/group_smart.go 2>/dev/null || true

          # 2. 注入 TypeSmart 常量定义
          if ! grep -q "TypeSmart" constant/proxy.go; then
            sed -i '' 's/TypeURLTest = "urltest"/TypeURLTest = "urltest"\
	TypeSmart   = "smart"/' constant/proxy.go || \
            sed -i 's/TypeURLTest = "urltest"/TypeURLTest = "urltest"\n\tTypeSmart   = "smart"/' constant/proxy.go
          fi

          # 3. 注入 smart 出站注册逻辑
          if ! grep -q "group.RegisterSmart" include/registry.go 2>/dev/null; then
            if grep -q "group.RegisterURLTest" include/registry.go; then
              sed -i '' 's/group.RegisterURLTest(registry)/group.RegisterURLTest(registry)\
	group.RegisterSmart(registry)/' include/registry.go || \
              sed -i 's/group.RegisterURLTest(registry)/group.RegisterURLTest(registry)\n\tgroup.RegisterSmart(registry)/' include/registry.go
            fi
          fi

          # 4. 注入 option/outbound.go 中的配置解析结构
          if ! grep -q "Smart" option/outbound.go; then
            sed -i '' 's/URLTest \*URLTestOutboundOptions `json:"urltest,omitempty"`/URLTest \*URLTestOutboundOptions `json:"urltest,omitempty"`\
	Smart   \*SmartOutboundOptions   `json:"smart,omitempty"`/' option/outbound.go || \
            sed -i 's/URLTest \*URLTestOutboundOptions `json:"urltest,omitempty"`/URLTest \*URLTestOutboundOptions `json:"urltest,omitempty"`\n\tSmart   \*SmartOutboundOptions   `json:"smart,omitempty"`/' option/outbound.go
          fi

          # 5. 清理并同步新增依赖
          go mod tidy

      - name: Build Libbox.xcframework (official build_libbox)
        working-directory: core
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          mv Libbox.xcframework "$GITHUB_WORKSPACE/sfi/"
          ls "$GITHUB_WORKSPACE/sfi/Libbox.xcframework"

      - name: Build app & package jailbreak deb (official script)
        working-directory: sfi
        run: /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-reF1nd-Smart-deb
          path: sfi/build/jailbreak/*.deb
