name: build-tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS --depth 1

      - name: Install ldid (for code signing)
        run: |
          set -e
          cd "$HOME"
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already present"
          else
            # Procursus 官方预编译 ldid (macOS arm64) — 已确认 URL
            curl -fL -o ldid_bin https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
            sudo cp ldid_bin /usr/local/bin/ldid
            sudo chmod +x /usr/local/bin/ldid
            echo "installed ldid (Procursus)"
          fi
          echo "--- verify ---"
          which ldid && ldid 2>&1 | head -1 || echo "ldid still missing"

      - name: Build (arm64, uses Xcode built-in SDK)
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SJJAuthBypass-deb
          path: packages/*.deb