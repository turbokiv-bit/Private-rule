name: build-tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS --depth 1

      - name: Install ldid
        run: |
          # 通过 Homebrew 装 ldid (Procursus 维护)
          brew install ldid proursus 2>/dev/null || brew install ldid 2>/dev/null || true
          # 若 brew 源没有，直接从 ldid 官方 GitHub 下载预编译二进制放到 PATH
          if ! command -v ldid >/dev/null 2>&1; then
            mkdir -p ~/bin
            curl -fL -o ~/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64 \
              || curl -fL -o ~/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_x86_64 \
              || echo "ldid download from release failed"
            chmod +x ~/bin/ldid
            echo "$HOME/bin" >> $GITHUB_PATH
          fi
          echo "== ldid =="
          which ldid || ls -la ~/bin/ldid

      - name: Build (arm64e)
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          echo "$HOME/bin" >> $GITHUB_PATH
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SJJAuthBypass-deb
          path: packages/*.deb
