name: Build IDIRingReadout deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build (rootless + rootful + roothide)
        run: |
          set -e
          make clean package FINALPACKAGE=1 ARCHS="arm64 arm64e" THEOS_PACKAGE_SCHEME=rootless || true
          for f in packages/*.deb; do mv "$f" "${f%.deb}-rootless.deb"; done
          make clean package FINALPACKAGE=1 ARCHS="arm64 arm64e" || true
          for f in packages/*.deb; do case "$f" in *rootless*) ;; *) mv "$f" "${f%.deb}-rootful.deb";; esac; done
          make clean package FINALPACKAGE=1 ARCHS="arm64 arm64e" THEOS_PACKAGE_SCHEME=roothide || true
          for f in packages/*.deb; do case "$f" in *rootless*|*rootful*) ;; *) mv "$f" "${f%.deb}-roothide.deb";; esac; done
          ls -la packages/

      - uses: actions/upload-artifact@v4
        with:
          name: IDIRingReadout-deb
          path: packages/*.deb
