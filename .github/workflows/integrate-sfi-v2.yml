name: Build SFI with merged smart outbound (fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: brew install dpkg ldid xcbeautify bash git

      - name: Clone sing-box-for-apple (with submodules)
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone reF1nd-stable core
        run: git clone --depth 1 -b reF1nd-stable https://github.com/reF1nd/sing-box.git core

      - name: Clone xiaobaf14g-testing (smart source)
        run: git clone --depth 1 -b xiaobaf14g-testing https://github.com/MiChongs/sing-box.git smart-src

      - name: Apply smart outbound merge into reF1nd core
        working-directory: core
        run: |
          set -e
          SM=../smart-src

          # 1) 复制 smart 专属算法库 / 服务 / 资源下载
          cp -r $SM/common/smart        common/smart
          cp -r $SM/common/assetdl      common/assetdl
          cp -r $SM/experimental/smart  experimental/smart
          cp -r $SM/experimental/geox   experimental/geox
          cp -r $SM/option/smart.go     option/smart.go

          # 2) smart 出站本体（group 目录）
          cp $SM/protocol/group/smart*.go protocol/group/

          # 3) clashapi 的 smart 支持
          cp $SM/experimental/clashapi/smart.go experimental/clashapi/

          # 4) urltest 升级为带 detail 的版本（smart 依赖）
          cp $SM/common/urltest/urltest.go common/urltest/urltest.go
          cp $SM/common/urltest/expected_status.go common/urltest/expected_status.go

          echo "=== 已复制的 smart 文件 ==="
          find . -path ./.git -prune -o -name '*smart*' -print | head -40

      - name: Patch integration points (register smart, add types, fill API gaps)
        working-directory: core
        run: |
          python3 - <<'PYEOF'
          import re, io

          # ---------- 1) constant/proxy.go: 加 TypeSmart ----------
          p = 'constant/proxy.go'
          s = open(p).read()
          if 'TypeSmart' not in s:
              s = s.replace('TypeURLTest     = "urltest"',
                            'TypeURLTest     = "urltest"\n\tTypeSmart       = "smart"')
          open(p, 'w').write(s)

          # ---------- 2) include/registry.go: 注册 Smart ----------
          p = 'include/registry.go'
          s = open(p).read()
          if 'RegisterSmart' not in s:
              s = s.replace('group.RegisterLoadBalance(registry)',
                            'group.RegisterLoadBalance(registry)\n\tgroup.RegisterSmart(registry)')
          open(p, 'w').write(s)

          # ---------- 3) adapter/experimental.go: 补 URLTestHistoryStorage 接口 ----------
          p = 'adapter/experimental.go'
          s = open(p).read()
          if 'URLTestHistoryStorage' not in s:
              block = '''type URLTestHistoryStorage interface {
	AddUpdateHook(hook *observable.Subscriber[struct{}])
	NotifyUpdated()
	LoadURLTestHistory(tag string) *URLTestHistory
	DeleteURLTestHistory(tag string)
	StoreURLTestHistory(tag string, history *URLTestHistory)
	Close() error
}

'''
              # 插在 ClashServer 前面
              if 'type ClashServer interface {' in s:
                  s = s.replace('type ClashServer interface {', block + 'type ClashServer interface {', 1)
          open(p, 'w').write(s)

          # ---------- 4) common/httpclient/manager.go: 补 LookupDetour ----------
          p = 'common/httpclient/manager.go'
          s = open(p).read()
          if 'LookupDetour' not in s:
              func = '''func (m *Manager) LookupDetour(tag string) string {
	m.access.Lock()
	defer m.access.Unlock()
	if client, ok := m.defines[tag]; ok {
		return client.Detour
	}
	return ""
}

'''
              s = s.replace('func (m *Manager) Initialize(',
                            func + 'func (m *Manager) Initialize(', 1)
          open(p, 'w').write(s)

          # ---------- 5) 校验 ----------
          print("--- registry ---");  os_system = None
          for f in ['include/registry.go']:
              s9 = open(f).read()
              assert 'RegisterSmart' in s9, 'missing RegisterSmart'
          for f in ['constant/proxy.go']:
              s9 = open(f).read()
              assert 'TypeSmart' in s9, 'missing TypeSmart'
          print("PATCH OK")
          PYEOF

      - name: Sync deps for smart (go.mod)
        working-directory: core
        run: |
          set -e
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          go mod tidy -e || true

      - name: Build Libbox.xcframework
        working-directory: core
        timeout-minutes: 90
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go clean -cache || true
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          test -d Libbox.xcframework && echo "✅ Libbox built"

      - name: Copy Libbox into sfi & build deb
        working-directory: sfi
        run: |
          cp -r ../core/Libbox.xcframework sfi/ 2>/dev/null || cp -r ../Libbox.xcframework sfi/ || true
          /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ref1nd-smart-deb
          path: sfi/build/jailbreak/*.deb