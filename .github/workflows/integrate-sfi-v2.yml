name: Build SFI (from source) with reF1nd core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash

      - name: Clone sing-box-for-apple (with submodules)
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone reF1nd sing-box core
        run: git clone --depth 1 -b reF1nd-testing https://github.com/reF1nd/sing-box.git core

      - name: Apply bridge & libbox interface fixes
        run: |
          cd core
          # 1) bridge 切网整体重载修复（adapter + libbox + protocol/bridge）
          curl -sSL "https://raw.githubusercontent.com/turbokiv-bit/Private-rule/main/restart-fix.patch" -o /tmp/restart-fix.patch
          echo "restart-fix.patch 大小: $(wc -c < /tmp/restart-fix.patch) bytes"
          git apply --verbose /tmp/restart-fix.patch
          echo "✅ restart-fix.patch 应用成功"
          # 2) debug.go 补 GoroutineDump（SFI dev 前端需要的桥接符号）
          curl -sSL "https://raw.githubusercontent.com/turbokiv-bit/Private-rule/main/debug-fix.patch" -o /tmp/debug-fix.patch
          echo "debug-fix.patch 大小: $(wc -c < /tmp/debug-fix.patch) bytes"
          git apply --verbose /tmp/debug-fix.patch
          echo "✅ debug-fix.patch 应用成功"

      - name: Build Libbox.xcframework (official build_libbox)
        working-directory: core
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          mv Libbox.xcframework "$GITHUB_WORKSPACE/sfi/"
          ls "$GITHUB_WORKSPACE/sfi/Libbox.xcframework"

      - name: Build app & package jailbreak deb (official script)
        working-directory: sfi
        run: /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ref1nd-source-deb
          path: sfi/build/jailbreak/*.deb
