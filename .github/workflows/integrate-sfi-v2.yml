name: Build SFI (from source) with reF1nd core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Clone sing-box-for-apple (with submodules)
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone reF1nd sing-box core
        run: git clone --depth 1 -b reF1nd-testing-next https://github.com/reF1nd/sing-box.git core

      - name: Build Libbox.xcframework from reF1nd core
        working-directory: core
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          gomobile bind -v -trimpath -ldflags "-s -w" \
            -target ios/arm64 -iosversion 15.0 \
            -o "$GITHUB_WORKSPACE/sfi/Libbox.xcframework" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,with_usbip,with_openvpn,with_openconnect,with_tailscale,with_low_memory,with_dhcp,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird" \
            ./experimental/libbox

      - name: Build app & package jailbreak deb (official script)
        working-directory: sfi
        run: /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ref1nd-source-deb
          path: sfi/build/jailbreak/*.deb
