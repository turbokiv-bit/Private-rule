name: Update Sukka List

on:
  schedule:
    # 每天北京时间 03:20 自动运行
    # GitHub Actions 使用 UTC 时间，所以这里是 UTC 19:20
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sukka-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout SukkaLab ruleset repository
        uses: actions/checkout@v4
        with:
          repository: SukkaLab/ruleset.skk.moe
          ref: master
          path: sukka-ruleset
          sparse-checkout: |
            List
          sparse-checkout-cone-mode: true

      - name: Sync List directory
        run: |
          rm -rf Sukka/List
          mkdir -p Sukka/List
          cp -a sukka-ruleset/List/. Sukka/List/

          echo "Synced files:"
          find Sukka/List -maxdepth 2 -type f | sort | head -100

      - name: Commit and push if changed
        run: |
          git status --short

          if git diff --quiet -- Sukka/List; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Sukka/List
          git commit -m "chore: sync Sukka List"
          git push
