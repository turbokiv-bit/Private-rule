name: Update Sukka Ruleset List

on:
  schedule:
    # 每天北京时间 03:20 执行
    # GitHub Actions 使用 UTC 时间，所以这里是 UTC 19:2
        - cron: "0 7-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Checkout SukkaLab ruleset List
        uses: actions/checkout@v4
        with:
          repository: SukkaLab/ruleset.skk.moe
          ref: master
          path: upstream
          sparse-checkout: |
            List
          sparse-checkout-cone-mode: true

      - name: Sync List directory
        run: |
          mkdir -p List
          rsync -av --delete upstream/List/ List/

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add List
          git commit -m "chore: update Sukka ruleset List"
          git push
