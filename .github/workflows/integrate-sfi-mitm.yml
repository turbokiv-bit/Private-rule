name: Build SFI (from source) with reF1nd core + MITM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash

      - name: Clone sing-box-for-apple (with submodules)
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone reF1nd sing-box core
        run: git clone --depth 1 -b reF1nd-testing https://github.com/reF1nd/sing-box.git core

      - name: Fetch upstream dev-test-mitm branch (for MITM source)
        working-directory: core
        run: |
          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch --depth 1 upstream dev-test-mitm
          git rev-parse upstream/dev-test-mitm

      - name: Apply core patches (MITM + restart-fix + lazy-recover)
        working-directory: core
        run: |
          echo "当前目录: $(pwd) (应为 .../core)"
          # 1) 拉取所有补丁脚本/patch（上传到你的 Private-rule repo）
          BASE="https://raw.githubusercontent.com/turbokiv-bit/Private-rule/main"
          curl -sSL "$BASE/restart-fix.py" -o /tmp/restart-fix.py
          curl -sSL "$BASE/lazy_recover_patch_fix-v2.py" -o /tmp/lazy_recover_patch_fix-v2.py
          curl -sSL "$BASE/mitm-port.patch" -o /tmp/mitm-port.patch

          echo "--- 应用 MITM patch ---"
          git apply --check /tmp/mitm-port.patch || { echo "❌ MITM patch check 失败"; exit 1; }
          git apply /tmp/mitm-port.patch || { echo "❌ MITM patch 应用失败"; exit 1; }
          echo "✅ MITM 已移植 (含 goja script 引擎依赖)"

          echo "--- 应用 restart-fix.py ---"
          python3 /tmp/restart-fix.py || { echo "❌ restart-fix 失败"; exit 1; }

          echo "--- 应用 lazy_recover (fix-v2) ---"
          python3 /tmp/lazy_recover_patch_fix-v2.py || { echo "❌ lazy_recover 失败"; exit 1; }

          echo "--- gofmt check ---"
          gofmt -l protocol/group/urltest.go mitm/ script/ | grep . && echo "⚠️ 有未格式化" || echo "gofmt OK"

          echo "--- 关键包编译检查 (darwin/arm64) ---"
          go get github.com/dop251/goja@v0.0.0-20250125213203-5ef83b82af17 2>/dev/null
          GOOS=darwin GOARCH=arm64 go build ./mitm/ ./script/ ./adapter/ ./option/ ./common/certificate/ ./experimental/cachefile/ ./route/ || { echo "❌ MITM 相关包编译失败"; exit 1; }
          GOOS=darwin GOARCH=arm64 go build ./protocol/group/ ./protocol/bridge/ || { echo "❌ 补丁相关包编译失败"; exit 1; }
          echo "✅ 全部关键包 darwin 编译通过"

      - name: Build Libbox.xcframework (official build_libbox)
        working-directory: core
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          mv Libbox.xcframework "$GITHUB_WORKSPACE/sfi/"
          ls "$GITHUB_WORKSPACE/sfi/Libbox.xcframework"

      - name: Build app & package jailbreak deb (official script)
        working-directory: sfi
        run: /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ref1nd-mitm-source-deb
          path: sfi/build/jailbreak/*.deb
