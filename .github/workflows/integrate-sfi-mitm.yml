name: Build SFI (from source) with reF1nd + MITM core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash

      - name: Clone sing-box-for-apple (with submodules)
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone reF1nd sing-box core
        run: git clone --depth 1 -b reF1nd-testing https://github.com/reF1nd/sing-box.git core

      - name: Apply core patches (restart-fix + lazy-recover + MITM)
        run: |
          cd core
          BASE="https://raw.githubusercontent.com/turbokiv-bit/Private-rule/main"
          curl -sSL "$BASE/restart-fix.py" -o /tmp/restart-fix.py
          curl -sSL "$BASE/lazy_recover_patch.py" -o /tmp/lazy_recover_patch.py
          curl -sSL "$BASE/mitm-ref1nd.patch" -o /tmp/mitm-ref1nd.patch
          echo "restart-fix.py 大小: $(wc -c < /tmp/restart-fix.py) bytes"
          echo "lazy_recover_patch.py 大小: $(wc -c < /tmp/lazy_recover_patch.py) bytes"

          echo "--- applying restart-fix.py ---"
          python3 /tmp/restart-fix.py || { echo "❌ restart-fix 失败"; exit 1; }

          echo "--- applying lazy_recover_patch.py ---"
          python3 /tmp/lazy_recover_patch.py || { echo "❌ lazy_recover 失败"; exit 1; }

          echo "--- applying mitm-ref1nd.patch ---"
          git apply /tmp/mitm-ref1nd.patch || { echo "❌ MITM 补丁失败"; exit 1; }

          echo "--- gofmt check (空输出=通过) ---"
          gofmt -l protocol/group/urltest.go

          echo "--- build check: protocol/group package ---"
          go build ./protocol/group/ || { echo "❌ protocol/group 编译失败"; exit 1; }

          echo "✅ 补丁全部应用成功，group 包编译通过"

      - name: Build Libbox.xcframework (official build_libbox)
        working-directory: core
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          mv Libbox.xcframework "$GITHUB_WORKSPACE/sfi/"
          ls "$GITHUB_WORKSPACE/sfi/Libbox.xcframework"

          # 可选：校验收进的内核确实带 MITM 标记
          echo "--- MITM markers check ---"
          for m in tls_decryption surge_url_rewrite surge_header_rewrite surge_body_rewrite "Surge HTTP API is not supported by sing-box"; do
            if strings "$GITHUB_WORKSPACE/sfi/Libbox.xcframework/ios-arm64/Libbox.framework/Libbox" | grep -Fq "$m"; then
              echo "ok: $m"
            else
              echo "warning: marker missing: $m"
            fi
          done

      - name: Apply MITM app UI patch
        working-directory: sfi
        run: |
          curl -sSL "https://raw.githubusercontent.com/turbokiv-bit/Private-rule/main/mitm-app-ui.patch" -o /tmp/mitm-app-ui.patch
          git apply /tmp/mitm-app-ui.patch
          echo "MITM app UI applied"

      - name: Fix SFI deployment target (iOS 16) before jailbreak build
        working-directory: sfi
        run: |
          curl -sSL "https://raw.githubusercontent.com/turbokiv-bit/Private-rule/main/sfi_deploytarget_fix.py" -o /tmp/sfi_deploytarget_fix.py
          python3 /tmp/sfi_deploytarget_fix.py

      - name: Build app & package jailbreak deb (official script)
        working-directory: sfi
        run: /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ref1nd-MITM-deb
          path: sfi/build/jailbreak/*.deb
