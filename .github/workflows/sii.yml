name: Build SFI with merged smart outbound

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash git

      - name: Clone sing-box-for-apple
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone reF1nd core
        run: git clone --depth 1 -b reF1nd-stable https://github.com/reF1nd/sing-box.git core

      - name: Clone xiaobaf14g-testing and copy smart outbound
        run: |
          git clone --depth 1 -b xiaobaf14g-testing https://github.com/MiChongs/sing-box.git smart-core
          
          # 复制 smart 相关文件到 core
          cp -r smart-core/component/outbound/smart core/component/outbound/ 2>/dev/null || true
          cp smart-core/constant/outbound.go core/constant/ 2>/dev/null || true
          cp smart-core/option/outbound_smart.go core/option/ 2>/dev/null || true
          cp -r smart-core/protocol/smart core/protocol/ 2>/dev/null || true
          
          # 清理
          rm -rf smart-core

      - name: Replace sfi core with modified core
        run: |
          rm -rf sfi/core
          cp -r core sfi/
          ls -la sfi/core/

      - name: Fix and register smart outbound
        working-directory: sfi/core
        run: |
          # 修复 constant/outbound.go - 确保它是有效的 Go 文件
          # 先备份原文件
          cp constant/outbound.go constant/outbound.go.bak 2>/dev/null || true
          
          # 检查文件是否以 package 开头
          if ! grep -q "^package" constant/outbound.go; then
            echo "Fixing constant/outbound.go - adding package declaration"
            # 在文件开头添加 package 声明
            echo "package constant" > constant/outbound.go.tmp
            echo "" >> constant/outbound.go.tmp
            echo "const OutboundTypeSmart = \"smart\"" >> constant/outbound.go.tmp
            # 保留原有的内容（如果有）
            cat constant/outbound.go >> constant/outbound.go.tmp 2>/dev/null || true
            mv constant/outbound.go.tmp constant/outbound.go
          fi
          
          # 检查 smart 目录是否正确位置
          if [ -d "component/outbound/smart" ]; then
            echo "Smart outbound found at component/outbound/smart"
            ls -la component/outbound/smart/
          else
            echo "ERROR: Smart outbound not found at component/outbound/smart"
            exit 1
          fi
          
          # 创建注册文件 - 使用正确的导入路径
          mkdir -p outbound
          cat > outbound/register_smart.go << 'EOF'
          package outbound
          
          import (
              "github.com/sagernet/sing-box/component/outbound/smart"
              "github.com/sagernet/sing-box/constant"
          )
          
          func init() {
              registerOutbound(constant.OutboundTypeSmart, func() Outbound {
                  return &smart.Outbound{}
              })
          }
          EOF

      - name: Fix go.mod for local packages
        working-directory: sfi/core
        run: |
          # 移除可能存在的错误 replace
          sed -i '' '/replace github.com\/sagernet\/sing-box\/outbound\/smart/d' go.mod 2>/dev/null || true
          
          # 添加正确的 replace - 指向 component/outbound/smart
          echo "" >> go.mod
          echo "// Use local smart package" >> go.mod
          echo "replace github.com/sagernet/sing-box/component/outbound/smart => ./component/outbound/smart" >> go.mod
          
          echo "=== go.mod (last 10 lines) ==="
          tail -10 go.mod

      - name: Build Libbox.xcframework
        working-directory: sfi/core
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          
          # 尝试编译，忽略依赖问题
          go mod tidy -e || true
          
          # 直接编译 Libbox
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64

      - name: Build app & package jailbreak deb
        working-directory: sfi
        run: /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ref1nd-smart-deb
          path: sfi/build/jailbreak/*.deb
