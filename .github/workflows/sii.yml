name: Build SFI with selectively merged outbounds

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash git

      - name: Clone sing-box-for-apple (Native Core)
        run: |
          # 包含子模块，直接使用官方较新的原生 core 以适配 iOS UI API
          git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone xiaobaf14g-testing (Smart Core)
        run: git clone --depth 1 -b xiaobaf14g-testing https://github.com/MiChongs/sing-box.git smart-core

      - name: Clone reF1nd core
        run: git clone --depth 1 -b reF1nd-stable https://github.com/reF1nd/sing-box.git ref1nd-core

      - name: Merge smart outbound into native core
        run: |
          echo "=== Copying smart files into sfi/core ==="
          
          if [ -d "smart-core/outbound/smart" ]; then
            mkdir -p sfi/core/outbound
            cp -r smart-core/outbound/smart sfi/core/outbound/ 2>/dev/null || true
          fi
          
          if [ -d "smart-core/component/outbound/smart" ]; then
            mkdir -p sfi/core/component/outbound
            cp -r smart-core/component/outbound/smart sfi/core/component/outbound/ 2>/dev/null || true
          fi
          
          if [ -f "smart-core/option/outbound_smart.go" ]; then
            mkdir -p sfi/core/option
            cp smart-core/option/outbound_smart.go sfi/core/option/ 2>/dev/null || true
          fi
          
          if [ -d "smart-core/protocol/smart" ]; then
            mkdir -p sfi/core/protocol
            cp -r smart-core/protocol/smart sfi/core/protocol/ 2>/dev/null || true
          fi
          
          echo "=== Merging reF1nd specific features ==="
          # 在这里手动添加需要从 reF1nd 移植的特定协议文件夹（按需取消注释并修改）
          # cp -r ref1nd-core/outbound/vless sfi/core/outbound/ 2>/dev/null || true

      - name: Fix and register smart outbound
        working-directory: sfi/core
        run: |
          echo "=== Injecting smart constant ==="
          # 为了不破坏原生核心的新 API，不直接覆盖 constant/outbound.go，而是追加常量
          if ! grep -q "OutboundTypeSmart" constant/outbound.go; then
            echo -e '\nconst OutboundTypeSmart = "smart"' >> constant/outbound.go
            echo "Injected OutboundTypeSmart into constant/outbound.go"
          fi
          
          echo "=== Creating register_smart.go ==="
          cat > outbound/register_smart.go << 'EOF'
          package outbound
          
          import (
              "github.com/sagernet/sing-box/outbound/smart"
              "github.com/sagernet/sing-box/constant"
          )
          
          func init() {
              registerOutbound(constant.OutboundTypeSmart, func() Outbound {
                  return &smart.Outbound{}
              })
          }
          EOF

      - name: Fix go.mod for local smart package
        working-directory: sfi/core
        run: |
          echo "" >> go.mod
          echo "// Use local packages" >> go.mod
          echo "replace github.com/sagernet/sing-box/outbound/smart => ./outbound/smart" >> go.mod
          
          # 清理并同步依赖
          go clean -modcache || true
          go mod tidy -e || true

      - name: Build Libbox.xcframework
        working-directory: sfi/core
        timeout-minutes: 90
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          
          go clean -cache || true
          
          echo "Building Libbox.xcframework..."
          go run -p 2 ./cmd/internal/build_libbox -target apple -platform ios/arm64
          
          if [ -d "Libbox.xcframework" ]; then
            echo "✅ Libbox.xcframework built successfully!"
          else
            echo "❌ Libbox.xcframework not found!"
            exit 1
          fi

      - name: Copy Libbox.xcframework to sfi (if needed)
        run: |
          if [ -d "sfi/core/Libbox.xcframework" ] && [ ! -d "sfi/Libbox.xcframework" ]; then
            cp -r sfi/core/Libbox.xcframework sfi/
            echo "✅ Copied Libbox.xcframework to sfi/"
          fi

      - name: Build app & package jailbreak deb
        working-directory: sfi
        timeout-minutes: 30
        run: /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-merged-smart-deb
          path: sfi/build/jailbreak/*.deb
