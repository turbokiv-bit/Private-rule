name: Build SFI with merged smart outbound

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash git

      - name: Clone sing-box-for-apple
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone reF1nd core
        run: git clone --depth 1 -b reF1nd-stable https://github.com/reF1nd/sing-box.git core

      - name: Clone xiaobaf14g-testing and copy smart outbound
        run: |
          git clone --depth 1 -b xiaobaf14g-testing https://github.com/MiChongs/sing-box.git smart-core
          
          # 复制 smart 相关文件
          mkdir -p core/outbound
          cp -r smart-core/outbound/smart core/outbound/ 2>/dev/null || true
          mkdir -p core/component/outbound
          cp -r smart-core/component/outbound/smart core/component/outbound/ 2>/dev/null || true
          cp smart-core/constant/outbound.go core/constant/ 2>/dev/null || true
          cp smart-core/option/outbound_smart.go core/option/ 2>/dev/null || true
          mkdir -p core/protocol
          cp -r smart-core/protocol/smart core/protocol/ 2>/dev/null || true
          
          rm -rf smart-core
          
          echo "=== core 目录中的 smart 文件 ==="
          find core -type f -name "*smart*" 2>/dev/null | head -20

      - name: Replace sfi core with modified core
        run: |
          rm -rf sfi/core
          cp -r core sfi/
          echo "=== sfi/core 中的 smart 文件 ==="
          find sfi/core -type f -name "*smart*" 2>/dev/null | head -20

      - name: 修复 go.mod 以支持本地 smart 包
        working-directory: sfi/core
        run: |
          # 检查 smart 包是否存在
          if [ -d "outbound/smart" ]; then
            echo "✅ 找到 outbound/smart 目录"
          elif [ -d "component/outbound/smart" ]; then
            echo "✅ 找到 component/outbound/smart 目录"
            # 创建软链接
            mkdir -p outbound
            ln -sf ../component/outbound/smart outbound/smart
          else
            echo "❌ 未找到 smart 目录，创建基础实现"
            mkdir -p outbound/smart
            cat > outbound/smart/outbound.go << 'EOF'
            package smart
            
            import (
                "context"
                "github.com/sagernet/sing-box/adapter"
                "github.com/sagernet/sing/common/logger"
            )
            
            type Outbound struct {
                adapter.Outbound
                logger logger.ContextLogger
                tag    string
            }
            
            func NewOutbound(ctx context.Context, logger logger.ContextLogger, tag string, options map[string]interface{}) (*Outbound, error) {
                return &Outbound{logger: logger, tag: tag}, nil
            }
            
            func (o *Outbound) Tag() string {
                return o.tag
            }
            
            func (o *Outbound) Type() string {
                return "smart"
            }
            EOF
          fi
          
          # 创建 constant/outbound.go
          mkdir -p constant
          cat > constant/outbound.go << 'EOF'
          package constant
          
          const OutboundTypeSmart = "smart"
          EOF
          
          # 创建 outbound 注册
          mkdir -p outbound
          cat > outbound/register_smart.go << 'EOF'
          package outbound
          
          import (
              _ "github.com/sagernet/sing-box/outbound/smart"
          )
          
          func init() {
              // 智能出站通过包 init 自动注册
          }
          EOF
          
          # 创建 libbox 导出
          mkdir -p libbox
          cat > libbox/smart_outbound.go << 'EOF'
          package libbox
          
          import (
              "github.com/sagernet/sing-box/adapter"
              "github.com/sagernet/sing-box/outbound/smart"
              "github.com/sagernet/sing/common/json"
              "github.com/sagernet/sing/common/logger"
          )
          
          // NewSmartOutbound 创建智能出站实例（导出给 Swift）
          func NewSmartOutbound(logger logger.ContextLogger, tag string, optionsJson string) (adapter.Outbound, error) {
              var options map[string]interface{}
              if err := json.Unmarshal([]byte(optionsJson), &options); err != nil {
                  return nil, err
              }
              return smart.NewOutbound(nil, logger, tag, options)
          }
          EOF
          echo "✅ 已创建 libbox/smart_outbound.go"
          
          # 在 go.mod 中添加 replace 指令，让 Go 使用本地包
          # 注意：包的导入路径是 github.com/sagernet/sing-box/outbound/smart
          # 我们需要告诉 Go 这个包在本地 ./outbound/smart
          echo "" >> go.mod
          echo "replace github.com/sagernet/sing-box/outbound/smart => ./outbound/smart" >> go.mod
          
          echo "=== go.mod 最后几行 ==="
          tail -5 go.mod
          
          echo "=== 创建的文件 ==="
          find . -name "*smart*.go" -type f 2>/dev/null

      - name: 修复 go.mod 依赖
        working-directory: sfi/core
        run: |
          # 执行 go mod tidy，忽略错误
          go mod tidy -e || true
          
          # 验证 smart 包是否可访问
          echo "=== 验证 smart 包 ==="
          go list ./outbound/smart 2>/dev/null && echo "✅ smart 包可访问" || echo "⚠️ smart 包验证失败，继续构建..."

      - name: Build Libbox.xcframework
        working-directory: sfi/core
        timeout-minutes: 90
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          
          # 清理缓存
          go clean -cache || true
          
          # 再次执行 go mod tidy
          go mod tidy -e || true
          
          # 显示 go.mod 的 replace 规则
          echo "=== go.mod replace 规则 ==="
          grep "replace" go.mod || echo "无 replace 规则"
          
          # 构建 Libbox
          echo "正在构建 Libbox.xcframework..."
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          
          # 检查构建结果
          if [ -d "Libbox.xcframework" ]; then
            echo "✅ Libbox.xcframework 构建成功！"
            ls -la Libbox.xcframework/
            
            # 检查导出的 Swift 头文件
            echo "=== 检查 Swift 头文件 ==="
            HEADER=$(find Libbox.xcframework -name "*.h" | head -1)
            if [ -n "$HEADER" ]; then
              echo "头文件: $HEADER"
              grep -i "smart\|autoredirect" "$HEADER" || echo "⚠️ 未找到 smart 相关类型"
            fi
          else
            echo "❌ Libbox.xcframework 未生成！"
            exit 1
          fi

      - name: Copy Libbox.xcframework to sfi
        run: |
          if [ -d "sfi/core/Libbox.xcframework" ]; then
            cp -r sfi/core/Libbox.xcframework sfi/
            echo "✅ 已复制 Libbox.xcframework 到 sfi/"
          elif [ -d "sfi/Libbox.xcframework" ]; then
            echo "✅ Libbox.xcframework 已在 sfi/ 中"
          else
            echo "❌ 找不到 Libbox.xcframework！"
            exit 1
          fi
          echo "=== sfi/Libbox.xcframework 内容 ==="
          ls -la sfi/Libbox.xcframework/ 2>/dev/null || echo "未找到"

      - name: Build app & package jailbreak deb
        working-directory: sfi
        timeout-minutes: 30
        run: |
          echo "开始构建 iOS 应用和 DEB 包..."
          /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-ref1nd-smart-deb
          path: sfi/build/jailbreak/*.deb
          if-no-files-found: warn