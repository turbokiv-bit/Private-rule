name: Build sfajb-roothelper shim

on:
  push:
    paths:
      - 'sfajb-shim/**'
      - '.github/workflows/build-sfajb-shim.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build shim (arm64 + arm64e, fat if possible)
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          build_arch () {
            ARCH=$1
            TARGET="$ARCH-apple-ios15.0"
            xcrun -sdk iphoneos clang -target "$TARGET" -arch $ARCH -isysroot "$SDK" \
              -O2 -fno-stack-protector -fno-exceptions -o "shim-$ARCH" sfajb-shim/shim.c \
            || xcrun -sdk iphoneos clang -target "$TARGET" -arch $ARCH -isysroot "$SDK" \
              -O2 -fno-stack-protector -fno-exceptions -Wl,-undefined,dynamic_lookup \
              -o "shim-$ARCH" sfajb-shim/shim.c
            echo "--- built shim-$ARCH:"; file "shim-$ARCH" || true
          }
          build_arch arm64
          build_arch arm64e || true
          if [ -f shim-arm64e ]; then
            lipo -create -output sfajb-roothelper-shim shim-arm64 shim-arm64e
          else
            cp shim-arm64 sfajb-roothelper-shim
          fi
          lipo -info sfajb-roothelper-shim
          file sfajb-roothelper-shim
          echo "--- linked libs:"; otool -L sfajb-roothelper-shim
          echo "--- undefined symbols:"; nm -u sfajb-roothelper-shim | head -30
          shasum -a 256 sfajb-roothelper-shim | tee sha256.txt

      - name: Codesign with original entitlements (best effort)
        run: |
          set -x
          brew install ldid || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -Ssfajb-shim/entitlements.plist sfajb-roothelper-shim
            ldid -e sfajb-roothelper-shim || true
          else
            echo "ldid not available on runner; sign on device with: ldid -Sentitlements.plist sfajb-roothelper-shim"
          fi
          shasum -a 256 sfajb-roothelper-shim | tee sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfajb-roothelper-shim
          path: |
            sfajb-roothelper-shim
            sha256.txt
