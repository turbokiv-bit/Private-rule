name: Build SFI (from source) with MiChongs xiaobaf14g-stable + libbox backport

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install tools
        run: |
          brew install dpkg ldid xcbeautify bash

      - name: Clone sing-box-for-apple (with submodules)
        run: git clone --depth 1 --recurse-submodules -b dev https://github.com/SagerNet/sing-box-for-apple.git sfi

      - name: Clone MiChongs sing-box core
        run: git clone --depth 1 -b xiaobaf14g-stable https://github.com/MiChongs/sing-box.git core

      - name: Apply libbox backport patch (first pass)
        run: |
          cd core
          curl -sSL "https://raw.githubusercontent.com/turbokiv-bit/Private-rule/main/michongs-libbox.patch" -o /tmp/michongs-libbox.patch
          echo "michongs-libbox.patch 大小: $(wc -c < /tmp/michongs-libbox.patch) bytes"
          git apply /tmp/michongs-libbox.patch || { echo "❌ libbox 补丁失败"; exit 1; }

          echo "--- go mod tidy (补 go.mod/go.sum 依赖条目) ---"
          go mod tidy || { echo "❌ go mod tidy 失败"; exit 1; }
          echo "go.sum 当前行数: $(wc -l < go.sum)"

          echo "--- gofmt check (空输出=通过) ---"
          gofmt -l experimental/libbox/debug.go experimental/libbox/setup.go experimental/libbox/platform.go

          echo "--- build check: experimental/libbox package ---"
          go build ./experimental/libbox/ || { echo "❌ libbox 编译失败"; exit 1; }

          echo "✅ libbox 补丁应用成功，libbox 包编译通过"

      - name: Build Libbox.xcframework (official build_libbox)
        working-directory: core
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64
          mv Libbox.xcframework "$GITHUB_WORKSPACE/sfi/"
          ls "$GITHUB_WORKSPACE/sfi/Libbox.xcframework"

      - name: Fix SFI deployment target (iOS 16) before jailbreak build
        working-directory: sfi
        run: |
          curl -sSL "https://raw.githubusercontent.com/turbokiv-bit/Private-rule/main/sfi_deploytarget_fix.py" -o /tmp/sfi_deploytarget_fix.py
          python3 /tmp/sfi_deploytarget_fix.py

      - name: Build app & package jailbreak deb (official script)
        working-directory: sfi
        run: /opt/homebrew/bin/bash Jailbreak/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-MiChongs-libbox-deb
          path: sfi/build/jailbreak/*.deb