name: Update MetaCubeX Meta Rules Dat

on:
  schedule:
    # 每天北京时间 04:00 自动运行
    # GitHub Actions 的 cron 使用 UTC 时间
    # 北京时间 04:00 = UTC 20:00
    - cron: "30 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metacubex-meta-rules-dat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout MetaCubeX meta-rules-dat repository
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/meta-rules-dat
          ref: meta
          path: metacubex-meta-rules-dat

      - name: Sync original meta branch
        run: |
          rm -rf MetaCubeX/meta-rules-dat
          mkdir -p MetaCubeX/meta-rules-dat

          rsync -a \
            --delete \
            --exclude='.git' \
            metacubex-meta-rules-dat/ \
            MetaCubeX/meta-rules-dat/

          echo "Original synced files:"
          find MetaCubeX/meta-rules-dat -maxdepth 3 -type f | sort | head -100

          echo "Original .list file count:"
          find MetaCubeX/meta-rules-dat -name "​*.list" -type f | wc -l

      - name: Generate Surge rule-set files
        run: |
          # 删除旧的大小写目录，避免 GitHub 路径混乱
          rm -rf MetaCubeX/Surge
          rm -rf MetaCubeX/surge
          mkdir -p MetaCubeX/surge

          python3 - <<'PY'
          from pathlib import Path
          import ipaddress
          import re

          source_root = Path("MetaCubeX/meta-rules-dat")
          output_root = Path("MetaCubeX/surge")

          supported_types = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-WILDCARD",
              "IP-CIDR",
              "IP-CIDR6",
              "IP-ASN",
              "USER-AGENT",
              "URL-REGEX",
              "PROCESS-NAME",
              "DEST-PORT",
              "SRC-IP",
              "SRC-IP-CIDR",
              "IN-PORT",
              "PROTOCOL",
          }

          skip_types = {
              "MATCH",
              "FINAL",
              "RULE-SET",
              "GEOSITE",
              "GEOIP",
          }

          def is_ip_cidr(value: str) -> bool:
              try:
                  ipaddress.ip_network(value, strict=False)
                  return "/" in value
              except Exception:
                  return False

          def is_ipv6_cidr(value: str) -> bool:
              try:
                  network = ipaddress.ip_network(value, strict=False)
                  return network.version == 6 and "/" in value
              except Exception:
                  return False

          def looks_like_domain(value: str) -> bool:
              if not value:
                  return False
              if " " in value:
                  return False
              if "/" in value:
                  return False
              if value.startswith("#"):
                  return False
              if "." not in value:
                  return False
              return True

          def normalize_rule(line: str):
              line = line.strip().lstrip("\ufeff")

              if not line:
                  return None

              if line.startswith("#"):
                  return line

              # 跳过 YAML 结构
              if line in {"payload:", "rules:", "rule-providers:"}:
                  return None

              if re.match(r"^[A-Za-z0-9_-]+:\s*$", line):
                  return None

              # YAML list:
              # - DOMAIN-SUFFIX,example.com
              if line.startswith("- "):
                  line = line[2:].strip()

              # 去掉首尾引号
              if len(line) >= 2 and line[0] == line[-1] and line[0] in {"'", '"'}:
                  line = line[1:-1].strip()

              # 去掉常见行内注释
              if " #" in line:
                  line = line.split(" #", 1)[0].strip()

              if not line:
                  return None

              if line.startswith("#"):
                  return line

              parts = [p.strip() for p in line.split(",") if p.strip()]

              # 已经是规则格式
              if len(parts) >= 2:
                  rule_type = parts[0].upper()

                  if rule_type in skip_types:
                      return None

                  if rule_type in supported_types:
                      value = parts[1]

                      if rule_type in {"IP-CIDR", "IP-CIDR6"}:
                          if any(p.lower() == "no-resolve" for p in parts[2:]):
                              return f"{rule_type},{value},no-resolve"
                          return f"{rule_type},{value}"

                      return f"{rule_type},{value}"

              # 纯域名格式：
              # example.com
              # .example.com
              # +.example.com
              if line.startswith("+."):
                  domain = line[2:].strip()
                  if looks_like_domain(domain):
                      return f"DOMAIN-SUFFIX,{domain}"

              if line.startswith("."):
                  domain = line[1:].strip()
                  if looks_like_domain(domain):
                      return f"DOMAIN-SUFFIX,{domain}"

              # 纯 IP CIDR
              if is_ip_cidr(line):
                  if is_ipv6_cidr(line):
                      return f"IP-CIDR6,{line}"
                  return f"IP-CIDR,{line}"

              if looks_like_domain(line):
                  return f"DOMAIN-SUFFIX,{line}"

              return None

          def convert_file(src: Path):
              rel = src.relative_to(source_root)
              dst = output_root / rel

              try:
                  text = src.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  print(f"Skip non-utf8 file: {src}")
                  return 0

              output = []
              seen = set()

              for raw_line in text.splitlines():
                  rule = normalize_rule(raw_line)

                  if rule is None:
                      continue

                  if not rule.startswith("#"):
                      if rule in seen:
                          continue
                      seen.add(rule)

                  output.append(rule)

              if not output:
                  return 0

              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text("\n".join(output).rstrip() + "\n", encoding="utf-8")
              print(f"Generated: {dst}")
              return 1

          list_files = list(source_root.rglob("​*.list"))

          print(f"Source root exists: {source_root.exists()}")
          print(f"Found .list files: {len(list_files)}")

          count = 0

          for src in list_files:
              if src.is_file():
                  count += convert_file(src)

          print(f"Generated Surge files count: {count}")

          if count == 0:
              print("Warning: no Surge files generated.")
              print("This workflow will continue so you can inspect synced original files.")
          PY

          echo "Generated Surge files:"
          find MetaCubeX/surge -type f | sort | head -100 || true

          echo "Generated Surge file count:"
          find MetaCubeX/surge -type f | wc -l || true

       - name: Commit and
