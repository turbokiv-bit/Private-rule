name: Update MetaCubeX Meta Rules Dat

on:
  schedule:
    # 每天北京时间 04:00 自动运行
    # GitHub Actions 的 cron 使用 UTC 时间
    # 北京时间 04:00 = UTC 20:00
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metacubex-meta-rules-dat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Checkout MetaCubeX meta-rules-dat repository
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/meta-rules-dat
          ref: meta
          path: metacubex-meta-rules-dat

      - name: Sync meta branch to MetaCubeX/meta-rules-dat
        run: |
          rm -rf MetaCubeX/meta-rules-dat
          mkdir -p MetaCubeX/meta-rules-dat

          rsync -a \
            --delete \
            --exclude='.git' \
            metacubex-meta-rules-dat/ \
            MetaCubeX/meta-rules-dat/

          echo "Synced files:"
          find MetaCubeX/meta-rules-dat -maxdepth 2 -type f | sort | head -100

      - name: Convert list files to Surge rule-set format
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("MetaCubeX/meta-rules-dat")

          # Surge 常见支持的规则类型
          supported_types = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-WILDCARD",
              "IP-CIDR",
              "IP-CIDR6",
              "IP-ASN",
              "GEOIP",
              "PROCESS-NAME",
              "USER-AGENT",
              "URL-REGEX",
              "DEST-PORT",
              "SRC-IP",
              "SRC-IP-CIDR",
              "IN-PORT",
              "PROTOCOL",
              "AND",
              "OR",
              "NOT",
          }

          def clean_line(line: str) -> str:
              line = line.strip()

              if not line:
                  return ""

              # 去掉 UTF-8 BOM
              line = line.lstrip("\ufeff")

              # 跳过 YAML 标题
              if line in {"payload:", "rules:", "rule-providers:"}:
                  return ""

              # 跳过纯注释
              if line.startswith("#"):
                  return line

              # 处理 Clash YAML 列表格式：
              # - DOMAIN-SUFFIX,example.com
              # - 'DOMAIN-SUFFIX,example.com'
              # - "DOMAIN-SUFFIX,example.com"
              if line.startswith("- "):
                  line = line[2:].strip()

              # 去掉首尾引号
              if len(line) >= 2:
                  if (line[0] == line[-1]) and line[0] in {"'", '"'}:
                      line = line[1:-1].strip()

              # 去掉行内 YAML 注释，但尽量避免误伤 URL-REGEX
              if " #" in line:
                  line = line.split(" #", 1)[0].strip()

              if not line:
                  return ""

              # 如果是 YAML key，跳过
              if re.match(r"^[A-Za-z0-9_-]+:\s*$", line):
                  return ""

              return line

          def convert_file(path: Path):
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  return

              output = []
              changed = False

              for raw in text.splitlines():
                  line = clean_line(raw)

                  if not line:
                      changed = True
                      continue

                  if line.startswith("#"):
                      output.append(line)
                      continue

                  rule_type = line.split(",", 1)[0].strip()

                  # 只保留 Surge 可识别的规则行
                  if rule_type in supported_types:
                      output.append(line)
                      if line != raw.strip():
                          changed = True
                  else:
                      # 常见 Clash 专用规则，Surge rule-set 里不直接保留
                      # 例如：MATCH、FINAL、RULE-SET、GEOSITE、GEOIP 视情况可能不适合 rule-set
                      output.append(f"# Unsupported or skipped: {line}")
                      changed = True

              new_text = "\n".join(output).rstrip() + "\n"

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  print(f"Converted: {path}")

          # 转换所有 .list 文件
          for path in root.rglob("​*.list"):
              if path.is_file():
                  convert_file(path)

          print("Surge list conversion finished.")
          PY

          echo "Converted list files:"
          find MetaCubeX/meta-rules-dat -name "​*.list" -type f | sort | head -100

      - name: Commit and push if changed
        run: |
          git status --short -- MetaCubeX/meta-rules-dat

          if [ -z "$(git status --porcelain -- MetaCubeX/meta-rules-dat)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add MetaCubeX/meta-rules-dat
          git commit -m "chore: sync and convert MetaCubeX meta-rules-dat"
          git push
