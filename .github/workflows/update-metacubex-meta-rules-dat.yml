name: Update MetaCubeX Meta Rules Dat

on:
  schedule:
    # 每天北京时间 04:00 自动运行
    # GitHub Actions 的 cron 使用 UTC 时间
    # 北京时间 04:00 = UTC 20:00
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metacubex-meta-rules-dat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone MetaCubeX meta-rules-dat repository
        run: |
          rm -rf metacubex-meta-rules-dat

          git clone \
            --depth 1 \
            --single-branch \
            --branch meta \
            https://github.com/MetaCubeX/meta-rules-dat.git \
            metacubex-meta-rules-dat

          echo "Upstream files:"
          find metacubex-meta-rules-dat -maxdepth 4 -type f | sort | head -100

          echo "Upstream .list file count:"
          find metacubex-meta-rules-dat -type f -iname "​*.list" | wc -l

      - name: Sync meta branch to MetaCubeX/meta-rules-dat
        run: |
          rm -rf MetaCubeX/meta-rules-dat
          mkdir -p MetaCubeX/meta-rules-dat

          rsync -a \
            --delete \
            --exclude='.git' \
            metacubex-meta-rules-dat/ \
            MetaCubeX/meta-rules-dat/

          echo "Synced files:"
          find MetaCubeX/meta-rules-dat -maxdepth 4 -type f | sort | head -100

          echo "Synced .list file count:"
          find MetaCubeX/meta-rules-dat -type f -iname "​*.list" | wc -l

      - name: Convert .list files to Surge rule-set format
        run: |
          python3 <<'PY'
          from pathlib import Path
          import ipaddress
          import re

          root = Path("MetaCubeX/meta-rules-dat")

          surge_types = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-WILDCARD",
              "IP-CIDR",
              "IP-CIDR6",
              "IP-ASN",
              "USER-AGENT",
              "URL-REGEX",
              "PROCESS-NAME",
              "DEST-PORT",
              "SRC-IP",
              "SRC-IP-CIDR",
              "IN-PORT",
              "PROTOCOL",
          }

          skip_types = {
              "MATCH",
              "FINAL",
              "RULE-SET",
              "GEOSITE",
              "GEOIP",
          }

          def is_cidr(value: str):
              try:
                  network = ipaddress.ip_network(value, strict=False)
                  if "/" not in value:
                      return None
                  return network.version
              except Exception:
                  return None

          def looks_like_domain(value: str) -> bool:
              if not value:
                  return False
              if value.startswith("#"):
                  return False
              if " " in value:
                  return False
              if "/" in value:
                  return False
              if "," in value:
                  return False
              if "." not in value:
                  return False
              return True

          def normalize_rule(raw: str):
              line = raw.strip().lstrip("\ufeff")

              if not line:
                  return None

              if line.startswith("#"):
                  return line

              # 跳过 YAML 结构行
              if line in {"payload:", "rules:", "rule-providers:"}:
                  return None

              if re.match(r"^[A-Za-z0-9_-]+:\s*$", line):
                  return None

              # YAML list 格式：
              # - DOMAIN-SUFFIX,example.com
              if line.startswith("- "):
                  line = line[2:].strip()

              # 去掉首尾引号
              if len(line) >= 2 and line[0] == line[-1] and line[0] in {"'", '"'}:
                  line = line[1:-1].strip()

              # 去掉常见行内注释
              if " #" in line:
                  line = line.split(" #", 1)[0].strip()

              # 去掉 MetaCubeX 属性：
              # example.com @cn
              if " @" in line:
                  line = line.split(" @", 1)[0].strip()

              if not line:
                  return None

              if line.startswith("#"):
                  return line

              # 已经是规则格式：
              # DOMAIN-SUFFIX,example.com
              # IP-CIDR,1.1.1.0/24
              parts = [p.strip() for p in line.split(",") if p.strip()]

              if len(parts) >= 2:
                  rule_type = parts[0].upper()

                  if rule_type in skip_types:
                      return None

                  if rule_type in surge_types:
                      value = parts[1]

                      if rule_type in {"IP-CIDR", "IP-CIDR6"}:
                          if any(p.lower() == "no-resolve" for p in parts[2:]):
                              return f"{rule_type},{value},no-resolve"
                          return f"{rule_type},{value}"

                      return f"{rule_type},{value}"

              lower = line.lower()

              # geosite 常见格式
              if lower.startswith("domain:"):
                  value = line.split(":", 1)[1].strip()
                  if looks_like_domain(value):
                      return f"DOMAIN-SUFFIX,{value}"

              if lower.startswith("suffix:"):
                  value = line.split(":", 1)[1].strip()
                  if looks_like_domain(value):
                      return f"DOMAIN-SUFFIX,{value}"

              if lower.startswith("full:"):
                  value = line.split(":", 1)[1].strip()
                  if looks_like_domain(value):
                      return f"DOMAIN,{value}"

              if lower.startswith("keyword:"):
                  value = line.split(":", 1)[1].strip()
                  if value:
                      return f"DOMAIN-KEYWORD,{value}"

              if lower.startswith("regexp:"):
                  value = line.split(":", 1)[1].strip()
                  if value:
                      return f"URL-REGEX,{value}"

              # AdGuard 格式
              if line.startswith("||") and line.endswith("^"):
                  value = line[2:-1].strip()
                  if looks_like_domain(value):
                      return f"DOMAIN-SUFFIX,{value}"

              # +.example.com
              if line.startswith("+."):
                  value = line[2:].strip()
                  if looks_like_domain(value):
                      return f"DOMAIN-SUFFIX,{value}"

              # .example.com
              if line.startswith("."):
                  value = line[1:].strip()
                  if looks_like_domain(value):
                      return f"DOMAIN-SUFFIX,{value}"

              # IP CIDR
              ip_version = is_cidr(line)
              if ip_version == 4:
                  return f"IP-CIDR,{line}"
              if ip_version == 6:
                  return f"IP-CIDR6,{line}"

              # 纯域名
              if looks_like_domain(line):
                  return f"DOMAIN-SUFFIX,{line}"

              return None

          def convert_file(path: Path):
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  print(f"Skip non-utf8 file: {path}")
                  return False

              output = []
              seen = set()

              for raw_line in text.splitlines():
                  rule = normalize_rule(raw_line)

                  if rule is None:
                      continue

                  if not rule.startswith("#"):
                      if rule in seen:
                          continue
                      seen.add(rule)

                  output.append(rule)

              if not output:
                  print(f"Skip empty after convert: {path}")
                  return False

              new_text = "\n".join(output).rstrip() + "\n"

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  print(f"Converted: {path}")
                  return True

              print(f"No need convert: {path}")
              return False

          list_files = sorted(root.rglob("​*.list"))

          print(f"Source root exists: {root.exists()}")
          print(f"Found .list files: {len(list_files)}")

          if len(list_files) == 0:
              raise SystemExit("No .list files found after clone and sync.")

          changed_count = 0

          for file in list_files:
              if file.is_file():
                  if convert_file(file):
                      changed_count += 1

          print(f"Converted .list files count: {changed_count}")
          PY

          echo "Converted .list file count:"
          find MetaCubeX/meta-rules-dat -type f -iname "​*.list" | wc -l

          echo "Converted list sample:"
          find MetaCubeX/meta-rules-dat -type f -iname "​*.list" | sort | head -20

      - name: Commit and push if changed
        run: |
          git status --short -- MetaCubeX/meta-rules-dat

          git add -A MetaCubeX/meta-rules-dat

          if git diff --cached --quiet -- MetaCubeX/meta-rules-dat; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: sync MetaCubeX meta-rules-dat and convert list to Surge"
          git push
