name: Convert Mihomo IP Rules to Surge

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Optional remote Mihomo rule URL. Leave empty to use input_path."
        required: false
        default: ""
      input_path:
        description: "Local Mihomo rule file path"
        required: false
        default: "rules/mihomo-ip.yaml"
      output_path:
        description: "Surge ruleset output path"
        required: false
        default: "surge/ip.list"

  schedule:
    # 每天北京时间 06:00 运行，GitHub Actions 使用 UTC
    - cron: "0 22 * * *​"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    env:
      SOURCE_URL: ${{ github.event.inputs.source_url || vars.MIHOMO_IP_SOURCE_URL || '' }}
      INPUT_PATH: ${{ github.event.inputs.input_path || 'rules/mihomo-ip.yaml' }}
      OUTPUT_PATH: ${{ github.event.inputs.output_path || 'surge/ip.list' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Convert Mihomo IP rules to Surge
        run: |
          if [ -n "$SOURCE_URL" ]; then
            echo "Using remote source: $SOURCE_URL"
            curl -fsSL --retry 3 "$SOURCE_URL" -o /tmp/mihomo-ip-source.yaml
            SOURCE_FILE="/tmp/mihomo-ip-source.yaml"
          else
            echo "Using local source: $INPUT_PATH"
            SOURCE_FILE="$INPUT_PATH"
          fi

          python scripts/mihomo_ip_to_surge.py \
            --input "$SOURCE_FILE" \
            --output "$OUTPUT_PATH" \
            --header "Generated from Mihomo IP rules"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add "$OUTPUT_PATH"
            git commit -m "chore: update Surge IP ruleset"
            git push
          else
            echo "No changes to commit"
          fi
