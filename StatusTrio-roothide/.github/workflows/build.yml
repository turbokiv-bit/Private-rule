# build.yml — StatusTrio roothide 构建 (Theos + roothide scheme, arm64 + arm64e)
name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          set -x
          sudo mkdir -p /opt/theos/sdks
          sudo chown -R $USER /opt/theos

      - name: Install Theos
        run: |
          set -x
          if [ ! -d /opt/theos ]; then
            sudo git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          fi
          # roothide 兼容层 (PathPrefix + cellekit)
          sudo git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks || true
          if [ -d /tmp/sdks ]; then
            ls /tmp/sdks | head
            # 拷贝 SDK 到 theos/sdks（该仓库自带 iOS SDK 需要单独装）
          fi

      - name: Download iOS SDK
        run: |
          set -x
          # Theos sdks 仓库签出的 sdk 目录，若为空则用 precomposed 包
          if [ ! -d /opt/theos/sdks/iPhoneOS16.5.sdk ] && [ ! -d /opt/theos/sdks/iPhoneOS16.4.sdk ]; then
            echo "No SDK found; will rely on theos's bundled — checking..."
            ls /opt/theos/sdks 2>/dev/null
          fi

      - name: Install ldid & dpkg
        run: |
          brew install ldid dpkg || true

      - name: Build (roothide)
        run: |
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=roothide
          export ARCHS="arm64 arm64e"
          export TARGET=iphone:clang:latest:16.0
          make clean
          make package FINALPACKAGE=1 DEBUG=0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StatusTrio-$(date +%Y%m%d)
          path: packages/*.deb
          if-no-files-found: error